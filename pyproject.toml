[project]
name = "dsr-mcp"
version = "0.1.0"
description = "MCP server that builds your Daily Status Report from real work (git, CRM tickets) and submits it to the BeForth CRM after you approve it."
requires-python = ">=3.10"
dependencies = ["mcp>=2", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dsr-mcp = "dsr_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsr_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
